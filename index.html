<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindred</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>Kindred</h1>
      <p class="tagline">A safe space for your chosen family.</p>
    </div>

    <!-- Create -->
    <div class="card">
      <h2>Create Gathering</h2>
      <input id="title" placeholder="Friday Game Night ✨" />
      <input id="description" placeholder="Games, wine & cozy vibes" />
      <input id="vibe" placeholder="Cozy / Fun / Chill" />
      <button onclick="createGathering()">Create Gathering</button>
    </div>

    <!-- Home -->
    <div class="card">
      <h2>Your Gatherings</h2>
      <div id="gatherings"></div>
    </div>

    <!-- Profile -->
    <div class="card">
      <h2>Profile</h2>
      <p id="count">0 gatherings created</p>
      <button class="secondary" onclick="resetApp()">Reset</button>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
