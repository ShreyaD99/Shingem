<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindred</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f7f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .container {
      padding: 15px;
      padding-bottom: 90px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .vibe {
      font-size: 12px;
      background: #eee;
      padding: 5px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
    }

    .section-title {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .prompt-box {
      background: #faf8f5;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .answer-item, .comment-item {
      background: #f5f5f5;
      padding: 8px 10px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .secondary-btn {
      background: #ece7df;
      color: #222;
    }

    .small-btn {
      width: auto;
      padding: 8px 12px;
      margin-top: 8px;
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: white;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      border-top: 1px solid #eee;
      padding: 8px 0;
    }

    .tabs button {
      background: none;
      color: #111;
      font-weight: 600;
      width: auto;
      margin-top: 0;
      padding: 8px 16px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }

    small {
      color: #666;
      display: block;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kindred ✨</h1>
    <p>building your chosen family</p>
  </header>

  <div class="container" id="app"></div>

  <div class="tabs">
    <button id="homeTab">Home</button>
    <button id="createTab">Create</button>
    <button id="profileTab">Profile</button>
  </div>

  <script>
    const STORAGE_KEY = "kindred_events_v5";
    let events = [];

    try {
      events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      events = [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showTab(tab) {
      if (tab === "home") renderHome();
      if (tab === "create") renderCreate();
      if (tab === "profile") renderProfile();
    }

    function defaultPrompts() {
      return [
        { question: "What movie should we watch?", answers: [] },
        { question: "What game should we play?", answers: [] },
        { question: "What music should we have in the background?", answers: [] },
        { question: "What would you love us to talk about?", answers: [] }
      ];
    }

    function renderHome() {
      const app = document.getElementById("app");
      let html = "<h3>Upcoming gatherings</h3>";

      if (events.length === 0) {
        html += "<div class='empty'>No gatherings yet — create one ✨</div>";
      } else {
        events.forEach((event, eventIndex) => {
          const title = escapeHtml(event.title || "Untitled gathering");
          const vibe = escapeHtml(event.vibe || "Meaningful");
          const description = escapeHtml(event.description || "A warm space to connect.");

          html += `
            <div class="card">
              <b>${title}</b>
              <small>${description}</small>
              <div class="vibe">${vibe}</div>

              <div class="section-title">Prompts for the evening</div>
          `;

          (event.prompts || []).forEach((prompt, promptIndex) => {
            html += `
              <div class="prompt-box">
                <div><strong>${escapeHtml(prompt.question)}</strong></div>

                ${(prompt.answers || []).map(answer => `
                  <div class="answer-item">${escapeHtml(answer)}</div>
                `).join("")}

                <input
                  id="answer-${eventIndex}-${promptIndex}"
                  placeholder="Add your idea..."
                />
                <button
                  class="secondary-btn small-btn"
                  onclick="addAnswer(${eventIndex}, ${promptIndex})"
                >
                  Add Answer
                </button>
              </div>
            `;
          });

          html += `
              <div class="section-title">Add your own question or comment</div>

              ${(event.guestComments || []).map(comment => `
                <div class="comment-item">${escapeHtml(comment)}</div>
              `).join("")}

              <textarea
                id="comment-${eventIndex}"
                placeholder="Share a thought, suggestion, or question..."
              ></textarea>
              <button
                class="secondary-btn"
                onclick="addComment(${eventIndex})"
              >
                Add Comment
              </button>

              <button onclick="join(${eventIndex})">Request to Join</button>
            </div>
          `;
        });
      }

      app.innerHTML = html;
    }

    function renderCreate() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="card">
          <h3>Create a gathering</h3>

          <input id="title" placeholder="Ladies Evening ✨" />
          <input id="vibe" placeholder="Cozy, meaningful, fun..." />
          <textarea id="desc" placeholder="What makes this gathering special?"></textarea>

          <div class="section-title">Default prompts</div>
          <small>These will be added automatically:</small>
          <small>• What movie should we watch?</small>
          <small>• What game should we play?</small>
          <small>• What music should we have in the background?</small>
          <small>• What would you love us to talk about?</small>

          <button id="createGatheringBtn">Create Gathering</button>
        </div>
      `;

      document.getElementById("createGatheringBtn").addEventListener("click", createEvent);
    }

    function renderProfile() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="card">
          <h3>Your space</h3>
          <p>${events.length} gathering${events.length === 1 ? "" : "s"} created so far ✨</p>
          <p>Delete all gatherings is available here only.</p>
          <button id="resetBtn">Delete All Gatherings</button>
        </div>
      `;

      document.getElementById("resetBtn").addEventListener("click", function () {
        const confirmed = confirm("Delete all gatherings?");
        if (!confirmed) return;
        localStorage.removeItem(STORAGE_KEY);
        events = [];
        showTab("home");
      });
    }

    function createEvent() {
      const titleEl = document.getElementById("title");
      const vibeEl = document.getElementById("vibe");
      const descEl = document.getElementById("desc");

      const title = titleEl.value.trim();
      const vibe = vibeEl.value.trim();
      const description = descEl.value.trim();

      if (!title) {
        alert("Please add a gathering name ✨");
        return;
      }

      const newEvent = {
        title: title,
        vibe: vibe || "Meaningful",
        description: description || "A warm space to connect.",
        prompts: defaultPrompts(),
        guestComments: []
      };

      events.unshift(newEvent);
      save();
      alert("Gathering created ✨");
      showTab("home");
    }

    function addAnswer(eventIndex, promptIndex) {
      const input = document.getElementById(`answer-${eventIndex}-${promptIndex}`);
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      events[eventIndex].prompts[promptIndex].answers.push(value);
      save();
      renderHome();
    }

    function addComment(eventIndex) {
      const input = document.getElementById(`comment-${eventIndex}`);
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      events[eventIndex].guestComments.push(value);
      save();
      renderHome();
    }

    function join(index) {
      const event = events[index];
      const title = event ? event.title : "this gathering";
      alert(`Request sent for "${title}" 💛`);
    }

    document.getElementById("homeTab").addEventListener("click", function () {
      showTab("home");
    });

    document.getElementById("createTab").addEventListener("click", function () {
      showTab("create");
    });

    document.getElementById("profileTab").addEventListener("click", function () {
      showTab("profile");
    });

    showTab("home");
  </script>
</body>
</html>
