<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ydxcorkwshehscivneli.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkeGNvcmt3c2hlaHNjaXZuZWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjgwNTAsImV4cCI6MjA5MDYwNDA1MH0.geVzJYnkfa3HIlaRNBT2bdv13YbxuR6gmFkxZnspY7c";
const ADMIN_EMAIL = "your@email.com"; // 👈 change this

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;

// ---------- AUTH FLOW ----------

async function sendPhoneOtp() {
  const phone = document.getElementById("phoneInput").value.trim();

  if (!phone) return alert("Enter phone number");

  const { error } = await supabaseClient.auth.signInWithOtp({ phone });

  if (error) return alert(error.message);

  renderVerify(phone);
}

async function verifyOtp(phone) {
  const token = document.getElementById("otpInput").value.trim();

  const { data, error } = await supabaseClient.auth.verifyOtp({
    phone,
    token,
    type: "sms"
  });

  if (error) return alert(error.message);

  currentUser = data.user;

  await ensureProfile();
  await loadProfile();
  routeUser();
}

// ---------- PROFILE ----------

async function ensureProfile() {
  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (!data) {
    await supabaseClient.from("profiles").insert([{
      id: currentUser.id,
      phone_number: currentUser.phone || ""
    }]);
  }
}

async function loadProfile() {
  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  currentProfile = data;
}

function isProfileComplete() {
  return currentProfile?.profile_completed;
}

async function saveProfile() {
  const fullName = document.getElementById("name").value;
  const insta = document.getElementById("insta").value;
  const linkedin = document.getElementById("linkedin").value;

  if (!fullName || !insta || !linkedin) {
    return alert("Fill all fields");
  }

  await supabaseClient
    .from("profiles")
    .update({
      full_name: fullName,
      instagram_handle: insta,
      linkedin_url: linkedin,
      profile_completed: true
    })
    .eq("id", currentUser.id);

  await loadProfile();
  renderHome();
}

// ---------- UI ----------

function renderLogin() {
  app.innerHTML = `
    <div class="card">
      <h3>Login</h3>
      <input id="phoneInput" placeholder="+1..." />
      <button onclick="sendPhoneOtp()">Send Code</button>
    </div>
  `;
}

function renderVerify(phone) {
  app.innerHTML = `
    <div class="card">
      <h3>Enter Code</h3>
      <input id="otpInput" placeholder="123456" />
      <button onclick="verifyOtp('${phone}')">Verify</button>
    </div>
  `;
}

function renderProfileSetup() {
  app.innerHTML = `
    <div class="card">
      <h3>Complete Profile</h3>
      <input id="name" placeholder="Full name" />
      <input id="insta" placeholder="Instagram" />
      <input id="linkedin" placeholder="LinkedIn" />
      <button onclick="saveProfile()">Save</button>
    </div>
  `;
}

function renderHome() {
  app.innerHTML = `
    <div class="card">
      <h3>Welcome ${currentProfile.full_name} ✨</h3>
      <p>Kindred is live 🎉</p>
    </div>
  `;
}

// ---------- ROUTING ----------

function routeUser() {
  if (!isProfileComplete()) {
    renderProfileSetup();
  } else {
    renderHome();
  }
}

// ---------- INIT ----------

async function init() {
  const { data } = await supabaseClient.auth.getSession();
  currentUser = data.session?.user;

  if (!currentUser) {
    renderLogin();
    return;
  }

  await ensureProfile();
  await loadProfile();
  routeUser();
}

init();
</script>
