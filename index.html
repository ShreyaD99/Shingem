<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindred — A safe space for your chosen family.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f4ef;
      color: #1f1f1f;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fffaf5;
      padding-bottom: 90px;
    }
    .header {
      padding: 24px 20px 10px;
      background: #fffaf5;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #f0e7dc;
    }
    .brand {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }
    .tagline {
      margin: 6px 0 0;
      font-size: 14px;
      color: #6f665c;
    }
    .screen {
      display: none;
      padding: 20px;
    }
    .screen.active {
      display: block;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
    }
    .card {
      background: white;
      border: 1px solid #eee3d5;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }
    .card p {
      margin: 0 0 8px;
      color: #5f584f;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f5ecdf;
      color: #7a5d34;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .button {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .button-primary {
      background: #1f1f1f;
      color: white;
    }
    .button-secondary {
      background: #efe5d8;
      color: #3a2f24;
    }
    .button-danger {
      background: #f6d9d9;
      color: #7d1f1f;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd2c4;
      border-radius: 14px;
      font-size: 15px;
      background: white;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: #fffaf5;
      border-top: 1px solid #eee3d5;
      display: flex;
      padding: 10px;
      gap: 10px;
    }
    .nav button {
      flex: 1;
      border: none;
      background: #f3eadf;
      border-radius: 14px;
      padding: 12px 10px;
      font-weight: 600;
      cursor: pointer;
      color: #4e4134;
    }
    .nav button.active {
      background: #1f1f1f;
      color: white;
    }
    .empty-state {
      text-align: center;
      color: #7b736a;
      padding: 30px 10px;
    }
    .small-text {
      font-size: 14px;
      color: #6f665c;
      line-height: 1.5;
    }
    .profile-stat {
      font-size: 32px;
      font-weight: 700;
      margin: 6px 0 4px;
    }
    .success-message,
    .error-message {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
    }
    .success-message {
      background: #eaf7ee;
      color: #1d6b39;
    }
    .error-message {
      background: #fdecec;
      color: #8a1f1f;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="brand">Kindred</h1>
      <p class="tagline">A safe space for your chosen family.</p>
    </div>

    <div id="homeScreen" class="screen active">
      <h2 class="section-title">Gatherings</h2>
      <div id="gatheringsList">
        <div class="empty-state">Loading gatherings...</div>
      </div>
    </div>

    <div id="createScreen" class="screen">
      <h2 class="section-title">Create Gathering</h2>

      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Friday Game Night" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Games and unwinding with friends"></textarea>
      </div>

      <div class="form-group">
        <label for="vibe">Vibe</label>
        <select id="vibe">
          <option value="Cozy">Cozy</option>
          <option value="Warm">Warm</option>
          <option value="Playful">Playful</option>
          <option value="Intentional">Intentional</option>
          <option value="Chill">Chill</option>
        </select>
      </div>

      <button id="createBtn" class="button button-primary">Create Gathering</button>
      <div id="formMessage"></div>
    </div>

    <div id="profileScreen" class="screen">
      <h2 class="section-title">Profile</h2>

      <div class="card">
        <div class="small-text">Gatherings created</div>
        <div id="gatheringCount" class="profile-stat">0</div>
      </div>

      <div class="card">
        <button id="resetBtn" class="button button-danger">Reset All Gatherings</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <button id="homeTab" class="active">Home</button>
    <button id="createTab">Create</button>
    <button id="profileTab">Profile</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://ydxcorkwshehscivneli.supabase.co'
    const supabaseKey = 'sb_publishable_FMYyj0UODgDKAKPNrsVikQ_oCZ5_wnz'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const homeScreen = document.getElementById('homeScreen')
    const createScreen = document.getElementById('createScreen')
    const profileScreen = document.getElementById('profileScreen')

    const homeTab = document.getElementById('homeTab')
    const createTab = document.getElementById('createTab')
    const profileTab = document.getElementById('profileTab')

    const gatheringsList = document.getElementById('gatheringsList')
    const gatheringCount = document.getElementById('gatheringCount')
    const formMessage = document.getElementById('formMessage')

    const titleInput = document.getElementById('title')
    const descriptionInput = document.getElementById('description')
    const vibeInput = document.getElementById('vibe')

    const createBtn = document.getElementById('createBtn')
    const resetBtn = document.getElementById('resetBtn')

    function showScreen(screenName) {
      homeScreen.classList.remove('active')
      createScreen.classList.remove('active')
      profileScreen.classList.remove('active')

      homeTab.classList.remove('active')
      createTab.classList.remove('active')
      profileTab.classList.remove('active')

      if (screenName === 'home') {
        homeScreen.classList.add('active')
        homeTab.classList.add('active')
      } else if (screenName === 'create') {
        createScreen.classList.add('active')
        createTab.classList.add('active')
      } else if (screenName === 'profile') {
        profileScreen.classList.add('active')
        profileTab.classList.add('active')
      }
    }

    homeTab.addEventListener('click', () => showScreen('home'))
    createTab.addEventListener('click', () => showScreen('create'))
    profileTab.addEventListener('click', () => showScreen('profile'))

    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text || ''
      return div.innerHTML
    }

    async function loadGatherings() {
      const { data, error } = await supabase
        .from('gatherings')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        gatheringsList.innerHTML = '<div class="error-message">Could not load gatherings. Check Supabase table and policies.</div>'
        gatheringCount.textContent = '0'
        console.error(error)
        return
      }

      if (!data || data.length === 0) {
        gatheringsList.innerHTML = '<div class="empty-state">No gatherings yet. Create your first one ✨</div>'
        gatheringCount.textContent = '0'
        return
      }

      gatheringCount.textContent = data.length

      gatheringsList.innerHTML = data.map(item => `
        <div class="card">
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.description || '')}</p>
          <div class="badge">${escapeHtml(item.vibe || 'Cozy')}</div>
          <button class="button button-secondary">Request to Join</button>
        </div>
      `).join('')
    }

    async function createGathering() {
      const title = titleInput.value.trim()
      const description = descriptionInput.value.trim()
      const vibe = vibeInput.value

      if (!title) {
        formMessage.innerHTML = '<div class="error-message">Please enter a title.</div>'
        return
      }

      createBtn.disabled = true
      createBtn.textContent = 'Creating...'
      formMessage.innerHTML = ''

      const { error } = await supabase
        .from('gatherings')
        .insert([{ title, description, vibe }])

      createBtn.disabled = false
      createBtn.textContent = 'Create Gathering'

      if (error) {
        formMessage.innerHTML = '<div class="error-message">Could not create gathering. Check Supabase setup.</div>'
        console.error(error)
        return
      }

      titleInput.value = ''
      descriptionInput.value = ''
      vibeInput.value = 'Cozy'

      await loadGatherings()
      showScreen('home')
    }

    async function resetGatherings() {
      const confirmed = window.confirm('Delete all gatherings?')
      if (!confirmed) return

      const { error } = await supabase
        .from('gatherings')
        .delete()
        .not('id', 'is', null)

      if (error) {
        alert('Could not reset gatherings. Add delete policy in Supabase.')
        console.error(error)
        return
      }

      await loadGatherings()
      showScreen('home')
    }

    createBtn.addEventListener('click', createGathering)
    resetBtn.addEventListener('click', resetGatherings)

    loadGatherings()
  </script>
</body>
</html>
