<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindred</title>
  <style>
    :root {
      --bg: #fbf7f3;
      --card: rgba(255, 255, 255, 0.86);
      --text: #231f1c;
      --text-soft: #6d655f;
      --pill: #f5eee7;
      --border: rgba(120, 100, 82, 0.10);
      --shadow: 0 10px 30px rgba(70, 54, 42, 0.08);
      --shadow-soft: 0 6px 18px rgba(70, 54, 42, 0.05);
      --gold: #b9925c;
      --like: #c86d7a;
      --bubble-self: #efe0d1;
      --bubble-other: #ffffff;
      --danger: #9f4b4b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fffaf5 0%, transparent 35%),
        radial-gradient(circle at top right, #f7efe7 0%, transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #f8f2eb 100%);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 22px 20px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, rgba(28,24,22,0.96), rgba(62,48,39,0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 10px 30px rgba(28, 24, 22, 0.18);
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    header p {
      margin: 7px 0 0;
      font-size: 13px;
      opacity: 0.88;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 16px 110px;
    }

    .screen-title {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 2px 16px;
    }

    .screen-subtitle {
      margin: -8px 2px 18px;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .hero-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.86) 0%, rgba(249,243,236,0.88) 100%);
      border: 1px solid rgba(120,100,82,0.09);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .hero-copy {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .event-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .event-description {
      margin-top: 8px;
      color: var(--text-soft);
      line-height: 1.55;
      font-size: 14px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill);
      color: #5f544b;
      border: 1px solid rgba(120, 100, 82, 0.08);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .section-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .section-note, .small-text {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .host-note {
      background: linear-gradient(180deg, #f8f1ea 0%, #f5ede5 100%);
      border: 1px solid rgba(185, 146, 92, 0.14);
      border-left: 4px solid var(--gold);
      padding: 14px;
      border-radius: 16px;
      color: #54483f;
      line-height: 1.55;
    }

    .top-pick-item,
    .answer-item,
    .comment-item,
    .prompt-box,
    .people-item {
      border-radius: 18px;
    }

    .top-pick-item {
      background: linear-gradient(180deg, #f7efe7 0%, #f4eadf 100%);
      border: 1px solid rgba(185, 146, 92, 0.14);
      padding: 13px 14px;
      margin-top: 10px;
      box-shadow: var(--shadow-soft);
    }

    .top-pick-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .top-pick-meta {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .prompt-box,
    .people-item {
      background: linear-gradient(180deg, rgba(255,255,255,0.76) 0%, rgba(249,244,239,0.92) 100%);
      border: 1px solid rgba(120, 100, 82, 0.09);
      padding: 14px;
      margin-top: 12px;
      box-shadow: var(--shadow-soft);
    }

    .prompt-question {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .answer-item,
    .comment-item {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(120, 100, 82, 0.08);
      padding: 12px;
      margin-top: 9px;
      box-shadow: 0 3px 10px rgba(70,54,42,0.03);
    }

    .item-line {
      line-height: 1.5;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .subtabs {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .subtabs button {
      width: auto;
      margin-top: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: white;
      color: #544941;
      box-shadow: none;
      border: 1px solid rgba(120,100,82,0.10);
    }

    .subtabs button.active {
      background: linear-gradient(180deg, #f1e5d9 0%, #eadbcc 100%);
      color: #40362f;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(120, 100, 82, 0.12);
      background: rgba(255,255,255,0.92);
      color: var(--text);
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      font-family: inherit;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(185, 146, 92, 0.42);
      box-shadow: 0 0 0 4px rgba(220, 198, 178, 0.18);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.18s ease;
      background: linear-gradient(135deg, #24201d 0%, #3d322a 100%);
      color: white;
      box-shadow: 0 8px 18px rgba(36, 32, 29, 0.18);
    }

    button:active {
      transform: scale(0.985);
    }

    .secondary-btn {
      background: linear-gradient(180deg, #f1e5d9 0%, #eadbcc 100%);
      color: #473d36;
      box-shadow: 0 8px 18px rgba(141, 116, 88, 0.12);
    }

    .like-btn, .tiny-btn {
      width: auto;
      padding: 8px 12px;
      margin-top: 0;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      background: white;
      color: var(--like);
      border: 1px solid rgba(200,109,122,0.18);
      box-shadow: none;
    }

    .danger-btn {
      background: linear-gradient(135deg, #8f4949 0%, #a34f4f 100%);
      color: white;
    }

    .empty {
      text-align: center;
      color: var(--text-soft);
      padding: 38px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.7);
      border: 1px dashed rgba(120,100,82,0.18);
      box-shadow: var(--shadow-soft);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120,100,82,0.12), transparent);
      margin: 16px 0;
    }

    .chat-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .chat-message {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      font-size: 14px;
      line-height: 1.45;
      border: 1px solid rgba(120,100,82,0.08);
    }

    .chat-message.other {
      align-self: flex-start;
      background: var(--bubble-other);
      border-top-left-radius: 8px;
    }

    .chat-message.self {
      align-self: flex-end;
      background: var(--bubble-self);
      border-top-right-radius: 8px;
    }

    .chat-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #5f544b;
    }

    .chat-time {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
      text-align: right;
    }

    .tabs {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(92vw, 520px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(120,100,82,0.10);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(70,54,42,0.10);
      z-index: 30;
    }

    .tabs button {
      width: 100%;
      margin-top: 0;
      padding: 11px 12px;
      border-radius: 14px;
      background: transparent;
      color: #544941;
      box-shadow: none;
      font-weight: 700;
    }

    .tabs button.active {
      background: linear-gradient(180deg, #f1e5d9 0%, #eadbcc 100%);
      color: #40362f;
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px 14px 110px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .event-title {
        font-size: 18px;
      }

      .screen-title {
        font-size: 20px;
      }

      .chat-message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kindred ✨</h1>
    <p>building your chosen family</p>
  </header>

  <div class="container" id="app"></div>

  <div class="tabs">
    <button id="homeTab" class="active">Home</button>
    <button id="createTab">Create</button>
    <button id="profileTab">Profile</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ydxcorkwshehscivneli.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkeGNvcmt3c2hlaHNjaXZuZWxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjgwNTAsImV4cCI6MjA5MDYwNDA1MH0.geVzJYnkfa3HIlaRNBT2bdv13YbxuR6gmFkxZnspY7c";
    const ADMIN_EMAIL = "your@email.com";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let events = [];
    let promptsByEvent = {};
    let answersByPrompt = {};
    let commentsByEvent = {};
    let chatByEvent = {};
    let joinRequestsByEvent = {};

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(dateString) {
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return "";
      return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function setActiveTab(tab) {
      document.getElementById("homeTab").classList.remove("active");
      document.getElementById("createTab").classList.remove("active");
      document.getElementById("profileTab").classList.remove("active");
      if (tab === "home") document.getElementById("homeTab").classList.add("active");
      if (tab === "create") document.getElementById("createTab").classList.add("active");
      if (tab === "profile") document.getElementById("profileTab").classList.add("active");
    }

    function defaultPromptQuestions() {
      return [
        "What movie should we watch?",
        "What game should we play?",
        "What music should we have in the background?",
        "What would you love us to talk about?"
      ];
    }

    async function sendPhoneOtp() {
      const phone = document.getElementById("phoneInput").value.trim();
      if (!phone) return alert("Please enter your phone number.");

      const { error } = await supabaseClient.auth.signInWithOtp({ phone });
      if (error) return alert(error.message);

      renderVerifyPhone(phone);
    }

    async function verifyPhoneOtp(phone) {
      const token = document.getElementById("otpInput").value.trim();
      if (!token) return alert("Please enter the code.");

      const { data, error } = await supabaseClient.auth.verifyOtp({
        phone,
        token,
        type: "sms"
      });

      if (error) return alert(error.message);

      currentUser = data.user || null;
      await ensureProfileRow();
      await loadProfile();
      await loadAllData();
      routeAfterAuth();
    }

    async function ensureProfileRow() {
      if (!currentUser) return;

      const { data: existing } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (!existing) {
        const { error } = await supabaseClient.from("profiles").insert([{
          id: currentUser.id,
          full_name: "",
          phone_number: currentUser.phone || "",
          instagram_handle: "",
          linkedin_url: "",
          profile_completed: false
        }]);
        if (error) alert(error.message);
      }
    }

    async function loadProfile() {
      if (!currentUser) {
        currentProfile = null;
        return;
      }

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

      if (error) return alert(error.message);
      currentProfile = data;
    }

    function profileIsComplete(profile) {
      return !!(
        profile &&
        profile.full_name &&
        profile.phone_number &&
        profile.instagram_handle &&
        profile.linkedin_url &&
        profile.profile_completed
      );
    }

    async function saveProfile() {
      const fullName = document.getElementById("fullName").value.trim();
      const phoneNumber = document.getElementById("profilePhone").value.trim();
      const instagram = document.getElementById("instagramHandle").value.trim();
      const linkedin = document.getElementById("linkedinUrl").value.trim();

      if (!fullName || !phoneNumber || !instagram || !linkedin) {
        return alert("Please complete all required fields.");
      }

      const { error } = await supabaseClient
        .from("profiles")
        .update({
          full_name: fullName,
          phone_number: phoneNumber,
          instagram_handle: instagram,
          linkedin_url: linkedin,
          profile_completed: true,
          updated_at: new Date().toISOString()
        })
        .eq("id", currentUser.id);

      if (error) return alert(error.message);

      await loadProfile();
      await loadAllData();
      renderHome();
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentProfile = null;
      events = [];
      promptsByEvent = {};
      answersByPrompt = {};
      commentsByEvent = {};
      chatByEvent = {};
      joinRequestsByEvent = {};
      renderLogin();
    }

    async function loadAllData() {
      const { data: eventsData, error: eventsErr } = await supabaseClient
        .from("events")
        .select("*")
        .order("created_at", { ascending: false });

      if (eventsErr) {
        events = [];
        return;
      }

      events = eventsData || [];
      promptsByEvent = {};
      answersByPrompt = {};
      commentsByEvent = {};
      chatByEvent = {};
      joinRequestsByEvent = {};

      const eventIds = events.map(e => e.id);
      if (!eventIds.length) return;

      const { data: promptsData } = await supabaseClient
        .from("prompts")
        .select("*")
        .in("event_id", eventIds)
        .order("sort_order", { ascending: true });

      (promptsData || []).forEach(p => {
        if (!promptsByEvent[p.event_id]) promptsByEvent[p.event_id] = [];
        promptsByEvent[p.event_id].push(p);
      });

      const promptIds = (promptsData || []).map(p => p.id);

      if (promptIds.length) {
        const { data: answersData } = await supabaseClient
          .from("prompt_answers")
          .select("*")
          .in("prompt_id", promptIds)
          .order("created_at", { ascending: true });

        (answersData || []).forEach(a => {
          if (!answersByPrompt[a.prompt_id]) answersByPrompt[a.prompt_id] = [];
          answersByPrompt[a.prompt_id].push(a);
        });
      }

      const { data: commentsData } = await supabaseClient
        .from("comments")
        .select("*")
        .in("event_id", eventIds)
        .order("created_at", { ascending: true });

      (commentsData || []).forEach(c => {
        if (!commentsByEvent[c.event_id]) commentsByEvent[c.event_id] = [];
        commentsByEvent[c.event_id].push(c);
      });

      const { data: chatData } = await supabaseClient
        .from("chat_messages")
        .select("*")
        .in("event_id", eventIds)
        .order("created_at", { ascending: true });

      (chatData || []).forEach(m => {
        if (!chatByEvent[m.event_id]) chatByEvent[m.event_id] = [];
        chatByEvent[m.event_id].push(m);
      });

      const { data: requestsData } = await supabaseClient
        .from("join_requests")
        .select("*")
        .in("event_id", eventIds)
        .order("created_at", { ascending: true });

      (requestsData || []).forEach(r => {
        if (!joinRequestsByEvent[r.event_id]) joinRequestsByEvent[r.event_id] = [];
        joinRequestsByEvent[r.event_id].push(r);
      });
    }

    function getTopPicks(eventId) {
      const picks = [];
      const prompts = promptsByEvent[eventId] || [];

      prompts.forEach(prompt => {
        (answersByPrompt[prompt.id] || []).forEach(answer => {
          picks.push({
            type: prompt.question,
            name: answer.user_name,
            text: answer.answer,
            likes: answer.likes_count || 0,
            mood: answer.mood || ""
          });
        });
      });

      (commentsByEvent[eventId] || []).forEach(comment => {
        picks.push({
          type: "Guest comment",
          name: comment.user_name,
          text: comment.comment,
          likes: comment.likes_count || 0,
          mood: comment.mood || ""
        });
      });

      return picks.sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 3);
    }

    function renderLogin() {
      setActiveTab("home");
      document.getElementById("app").innerHTML = `
        <div class="card">
          <div class="section-title" style="margin-top:0;">Join Kindred</div>
          <div class="section-note">Enter your phone number to receive a login code.</div>
          <input id="phoneInput" placeholder="+1 555 555 5555" />
          <button onclick="sendPhoneOtp()">Send Code</button>
        </div>
      `;
    }

    function renderVerifyPhone(phone) {
      setActiveTab("home");
      document.getElementById("app").innerHTML = `
        <div class="card">
          <div class="section-title" style="margin-top:0;">Verify your phone</div>
          <div class="section-note">We sent a code to ${escapeHtml(phone)}</div>
          <input id="otpInput" placeholder="Enter code" />
          <button onclick="verifyPhoneOtp('${phone}')">Verify Code</button>
        </div>
      `;
    }

    function renderCompleteProfile() {
      setActiveTab("home");
      document.getElementById("app").innerHTML = `
        <div class="card">
          <div class="section-title" style="margin-top:0;">Complete your profile</div>
          <div class="section-note">These details are required before using Kindred.</div>

          <input id="fullName" placeholder="Full name" value="${escapeHtml(currentProfile?.full_name || "")}" />
          <input id="profilePhone" placeholder="Phone number" value="${escapeHtml(currentProfile?.phone_number || currentUser?.phone || "")}" />
          <input id="instagramHandle" placeholder="Instagram handle" value="${escapeHtml(currentProfile?.instagram_handle || "")}" />
          <input id="linkedinUrl" placeholder="LinkedIn profile URL" value="${escapeHtml(currentProfile?.linkedin_url || "")}" />

          <button onclick="saveProfile()">Save Profile</button>
        </div>
      `;
    }

    function renderAuthCard() {
      if (!currentUser || !currentProfile) {
        return `
          <div class="card">
            <div class="section-title" style="margin-top:0;">Not signed in</div>
            <div class="section-note">Sign in to create gatherings, chat, and join events.</div>
            <button onclick="renderLogin()">Sign In</button>
          </div>
        `;
      }

      return `
        <div class="card">
          <div class="section-title" style="margin-top:0;">Welcome, ${escapeHtml(currentProfile.full_name || "Guest")} ✨</div>
          <div class="small-text">${escapeHtml(currentProfile.phone_number || "")}</div>
          <div class="small-text">${escapeHtml(currentProfile.instagram_handle || "")}</div>
          <div class="small-text">${escapeHtml(currentProfile.linkedin_url || "")}</div>
          <button class="secondary-btn" onclick="signOut()">Sign Out</button>
        </div>
      `;
    }

    function renderHome() {
      setActiveTab("home");

      let html = renderAuthCard();
      html += `
        <div class="hero-card">
          <div class="hero-title">Create evenings people want to remember.</div>
          <div class="hero-copy">Gather ideas, shape the vibe, and plan intentional moments that feel warm, thoughtful, and easy.</div>
        </div>

        <div class="screen-title">Upcoming gatherings</div>
        <div class="screen-subtitle">A clean overview of what’s coming up.</div>
      `;

      if (events.length === 0) {
        html += `<div class="empty">No gatherings yet — create one ✨</div>`;
      } else {
        events.forEach((event, eventIndex) => {
          html += `
            <div class="card">
              <div class="event-title">${escapeHtml(event.title)}</div>
              <div class="event-description">${escapeHtml(event.description || "A warm space to connect.")}</div>

              <div class="meta-row">
                <div class="pill">✨ ${escapeHtml(event.vibe || "Meaningful")}</div>
                ${event.event_mood ? `<div class="pill">☁️ ${escapeHtml(event.event_mood)}</div>` : ""}
                ${event.event_date ? `<div class="pill">📅 ${escapeHtml(event.event_date)}</div>` : ""}
                ${event.event_time ? `<div class="pill">🕒 ${escapeHtml(event.event_time)}</div>` : ""}
                ${event.location ? `<div class="pill">📍 ${escapeHtml(event.location)}</div>` : ""}
              </div>

              <button onclick="openEvent(${eventIndex}, 'chat')">Open Gathering</button>
            </div>
          `;
        });
      }

      document.getElementById("app").innerHTML = html;
    }

    function renderCreate() {
      setActiveTab("create");

      if (!currentUser || !profileIsComplete(currentProfile)) {
        document.getElementById("app").innerHTML = `
          ${renderAuthCard()}
          <div class="empty">Sign in and complete your profile first to create a gathering ✨</div>
        `;
        return;
      }

      document.getElementById("app").innerHTML = `
        ${renderAuthCard()}
        <div class="screen-title">Create a gathering</div>
        <div class="screen-subtitle">Set the tone, shape the mood, and add the essentials beautifully.</div>

        <div class="card">
          <input id="title" placeholder="Ladies Evening ✨" />

          <div class="form-grid">
            <input id="vibe" placeholder="Cozy, meaningful, fun..." />
            <select id="eventMood">
              <option>Chill</option>
              <option>Fun</option>
              <option>Deep talk</option>
              <option>Cozy</option>
              <option>Party</option>
            </select>
          </div>

          <div class="form-grid">
            <input id="date" placeholder="Friday, April 5" />
            <input id="time" placeholder="7:00 PM" />
          </div>

          <input id="location" placeholder="Chelsea / My apartment" />
          <textarea id="desc" placeholder="What makes this gathering special?"></textarea>
          <textarea id="hostNote" placeholder="Host note: what kind of evening are you imagining?"></textarea>

          <div class="section-title">Default prompts</div>
          <div class="section-note">These help guests contribute ideas before the evening begins.</div>
          <div class="small-text">• What movie should we watch?</div>
          <div class="small-text">• What game should we play?</div>
          <div class="small-text">• What music should we have in the background?</div>
          <div class="small-text">• What would you love us to talk about?</div>

          <button onclick="createEvent()">Create Gathering</button>
        </div>
      `;
    }

    function renderProfile() {
      setActiveTab("profile");

      const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
      let html = renderAuthCard();

      html += `
        <div class="screen-title">Your space</div>
        <div class="screen-subtitle">A quiet place to manage your gatherings and reset things when needed.</div>
      `;

      if (isAdmin) {
        html += `
          <div class="card">
            <div style="font-size:18px; font-weight:700;">${events.length} gathering${events.length === 1 ? "" : "s"} created so far ✨</div>
            <div class="section-note">Admin tools are enabled for your account.</div>
            <button id="resetBtn" class="danger-btn">Delete All Gatherings</button>
          </div>
        `;
      }

      html += `
        <div class="card">
          <div class="section-title" style="margin-top:0;">Manage gatherings</div>
          ${
            events.length === 0
              ? `<div class="small-text">No gatherings to manage yet.</div>`
              : events.map((event) => `
                  <div class="prompt-box">
                    <div class="prompt-question">${escapeHtml(event.title)}</div>
                    <div class="small-text">${escapeHtml(event.description || "")}</div>
                    ${(currentUser && (currentUser.email === event.host_email || isAdmin))
                      ? `<button class="danger-btn" onclick="deleteEvent('${event.id}')">Delete This Gathering</button>`
                      : `<div class="small-text">Only the host can delete this gathering.</div>`
                    }
                  </div>
                `).join("")
          }
        </div>
      `;

      document.getElementById("app").innerHTML = html;

      if (isAdmin) {
        const btn = document.getElementById("resetBtn");
        if (btn) btn.addEventListener("click", deleteAllEvents);
      }
    }

    function openEvent(eventIndex, subtab = "chat") {
      const event = events[eventIndex];
      if (!event) return renderHome();

      const isHost = currentUser && currentUser.email === event.host_email;
      const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
      const topPicks = getTopPicks(event.id);
      const prompts = promptsByEvent[event.id] || [];
      const comments = commentsByEvent[event.id] || [];
      const chat = chatByEvent[event.id] || [];
      const requests = joinRequestsByEvent[event.id] || [];

      let html = renderAuthCard();

      html += `
        <div class="card">
          <button class="secondary-btn" onclick="renderHome()">← Back to Home</button>

          <div class="section-title" style="margin-top:16px; font-size:20px;">${escapeHtml(event.title)}</div>
          <div class="event-description">${escapeHtml(event.description || "A warm space to connect.")}</div>

          <div class="meta-row">
            <div class="pill">✨ ${escapeHtml(event.vibe || "Meaningful")}</div>
            ${event.event_mood ? `<div class="pill">☁️ ${escapeHtml(event.event_mood)}</div>` : ""}
            ${event.event_date ? `<div class="pill">📅 ${escapeHtml(event.event_date)}</div>` : ""}
            ${event.event_time ? `<div class="pill">🕒 ${escapeHtml(event.event_time)}</div>` : ""}
            ${event.location ? `<div class="pill">📍 ${escapeHtml(event.location)}</div>` : ""}
          </div>

          ${event.host_note ? `
            <div class="section-title">From the host</div>
            <div class="host-note">${escapeHtml(event.host_note)}</div>
          ` : ""}

          <div class="subtabs">
            <button class="${subtab === 'chat' ? 'active' : ''}" onclick="openEvent(${eventIndex}, 'chat')">Chat</button>
            <button class="${subtab === 'ideas' ? 'active' : ''}" onclick="openEvent(${eventIndex}, 'ideas')">Ideas</button>
            <button class="${subtab === 'people' ? 'active' : ''}" onclick="openEvent(${eventIndex}, 'people')">People</button>
          </div>
      `;

      if (subtab === "chat") {
        html += `
          <div class="section-title">Event chat</div>
          <div class="small-text">A soft space for the group conversation.</div>

          <div class="chat-wrap">
            ${
              chat.length === 0
                ? `<div class="small-text">No messages yet — start the conversation ✨</div>`
                : chat.map(msg => `
                    <div class="chat-message ${msg.is_self ? "self" : "other"}">
                      ${!msg.is_self ? `<div class="chat-name">${escapeHtml(msg.user_name)}</div>` : ""}
                      <div>${escapeHtml(msg.message)}</div>
                      <div class="chat-time">${escapeHtml(formatTime(msg.created_at))}</div>
                    </div>
                  `).join("")
            }
          </div>

          ${currentUser ? `
            <input id="chatName" placeholder="Your name" value="${escapeHtml(currentProfile?.full_name || "")}" />
            <textarea id="chatMessage" placeholder="Type a message..."></textarea>
            <div class="row">
              <button class="secondary-btn" onclick="sendMessage('${event.id}', false, ${eventIndex})">Send as Guest</button>
              <button onclick="sendMessage('${event.id}', true, ${eventIndex})">Send as You</button>
            </div>
          ` : `<div class="small-text">Sign in to chat.</div>`}
        `;
      }

      if (subtab === "ideas") {
        html += `
          <div class="section-title">Top picks</div>
          ${
            topPicks.length === 0
              ? `<div class="small-text">No suggestions yet — be the first ✨</div>`
              : topPicks.map(item => `
                  <div class="top-pick-item">
                    <div class="top-pick-title">${escapeHtml(item.text)}</div>
                    <div class="top-pick-meta">
                      ${escapeHtml(item.name)} • ${escapeHtml(item.type)}${item.mood ? ` • ${escapeHtml(item.mood)}` : ""} • ❤️ ${item.likes}
                    </div>
                  </div>
                `).join("")
          }

          <div class="section-title">Prompts for the evening</div>
        `;

        prompts.forEach((prompt, promptIndex) => {
          const answers = answersByPrompt[prompt.id] || [];
          html += `
            <div class="prompt-box">
              <div class="prompt-question">${escapeHtml(prompt.question)}</div>

              ${answers.map(answer => `
                <div class="answer-item">
                  <div class="item-line"><strong>${escapeHtml(answer.user_name)}</strong>: ${escapeHtml(answer.answer)}</div>
                  <div class="row">
                    ${answer.mood ? `<span class="pill">${escapeHtml(answer.mood)}</span>` : ""}
                    <button class="like-btn" onclick="likeAnswer('${answer.id}', ${eventIndex})">❤️ ${answer.likes_count || 0}</button>
                  </div>
                </div>
              `).join("")}

              ${currentUser ? `
                <input id="answerName-${promptIndex}" placeholder="Your name" value="${escapeHtml(currentProfile?.full_name || "")}" />
                <select id="answerMood-${promptIndex}">
                  <option>Chill</option>
                  <option>Fun</option>
                  <option>Deep talk</option>
                  <option>Cozy</option>
                  <option>Party</option>
                </select>
                <input id="answerText-${promptIndex}" placeholder="Add your idea..." />
                <button class="secondary-btn" onclick="addAnswer('${prompt.id}', ${promptIndex}, ${eventIndex})">Add Answer</button>
              ` : `<div class="small-text">Sign in to add ideas.</div>`}
            </div>
          `;
        });

        html += `
          <div class="section-title">Add your own question or comment</div>

          ${comments.map(comment => `
            <div class="comment-item">
              <div class="item-line"><strong>${escapeHtml(comment.user_name)}</strong>: ${escapeHtml(comment.comment)}</div>
              <div class="row">
                ${comment.mood ? `<span class="pill">${escapeHtml(comment.mood)}</span>` : ""}
                <button class="like-btn" onclick="likeComment('${comment.id}', ${eventIndex})">❤️ ${comment.likes_count || 0}</button>
              </div>
            </div>
          `).join("")}

          ${currentUser ? `
            <input id="commentName" placeholder="Your name" value="${escapeHtml(currentProfile?.full_name || "")}" />
            <select id="commentMood">
              <option>Chill</option>
              <option>Fun</option>
              <option>Deep talk</option>
              <option>Cozy</option>
              <option>Party</option>
            </select>
            <textarea id="commentText" placeholder="Share a thought, suggestion, or question..."></textarea>
            <button class="secondary-btn" onclick="addComment('${event.id}', ${eventIndex})">Add Comment</button>
          ` : `<div class="small-text">Sign in to add comments.</div>`}
        `;
      }

      if (subtab === "people") {
        html += `
          <div class="section-title">People</div>
          <div class="small-text">Join requests and attendee list for this gathering.</div>

          <div class="people-item">
            <div class="prompt-question">Join requests</div>
            ${
              requests.length === 0
                ? `<div class="small-text">No join requests yet.</div>`
                : requests.map(req => `
                    <div class="answer-item">
                      <div class="item-line"><strong>${escapeHtml(req.guest_name)}</strong></div>
                      <div class="small-text">Status: ${escapeHtml(req.status)}</div>
                      ${(isHost || isAdmin) ? `
                        <div class="row">
                          <button class="secondary-btn tiny-btn" onclick="updateJoinRequest('${req.id}', 'approved', ${eventIndex})">Approve</button>
                          <button class="tiny-btn danger-btn" onclick="updateJoinRequest('${req.id}', 'declined', ${eventIndex})">Decline</button>
                        </div>
                      ` : ""}
                    </div>
                  `).join("")
            }

            ${currentUser ? `
              <input id="joinName" placeholder="Your name to request joining" value="${escapeHtml(currentProfile?.full_name || "")}" />
              <button onclick="join('${event.id}', ${eventIndex})">Request to Join</button>
            ` : `<div class="small-text">Sign in to request joining.</div>`}
          </div>

          <div class="people-item">
            <div class="prompt-question">Approved guests</div>
            ${
              requests.filter(r => r.status === "approved").length === 0
                ? `<div class="small-text">No approved guests yet.</div>`
                : requests
                    .filter(r => r.status === "approved")
                    .map(r => `<div class="answer-item"><div class="item-line"><strong>${escapeHtml(r.guest_name)}</strong></div></div>`)
                    .join("")
            }
          </div>
        `;
      }

      html += `
          <div class="divider"></div>
          <button class="secondary-btn" onclick="copySummary(${eventIndex})">Copy Event Summary</button>
        </div>
      `;

      document.getElementById("app").innerHTML = html;
    }

    async function createEvent() {
      const title = document.getElementById("title").value.trim();
      const vibe = document.getElementById("vibe").value.trim();
      const description = document.getElementById("desc").value.trim();
      const hostNote = document.getElementById("hostNote").value.trim();
      const eventMood = document.getElementById("eventMood").value;
      const eventDate = document.getElementById("date").value.trim();
      const eventTime = document.getElementById("time").value.trim();
      const location = document.getElementById("location").value.trim();

      if (!title) return alert("Please add a gathering name ✨");

      const { data: inserted, error } = await supabaseClient
        .from("events")
        .insert([{
          title,
          vibe: vibe || "Meaningful",
          event_mood: eventMood || "Chill",
          event_date: eventDate,
          event_time: eventTime,
          location,
          description: description || "A warm space to connect.",
          host_note: hostNote || "",
          host_email: currentUser.email
        }])
        .select()
        .single();

      if (error) return alert(error.message);

      const prompts = defaultPromptQuestions().map((q, i) => ({
        event_id: inserted.id,
        question: q,
        sort_order: i
      }));

      const { error: promptError } = await supabaseClient.from("prompts").insert(prompts);
      if (promptError) return alert(promptError.message);

      await loadAllData();
      alert("Gathering created ✨");
      renderHome();
    }

    async function addAnswer(promptId, promptIndex, eventIndex) {
      const name = document.getElementById(`answerName-${promptIndex}`).value.trim() || currentProfile?.full_name || "Guest";
      const mood = document.getElementById(`answerMood-${promptIndex}`).value;
      const text = document.getElementById(`answerText-${promptIndex}`).value.trim();
      if (!text) return;

      const { error } = await supabaseClient.from("prompt_answers").insert([{
        prompt_id: promptId,
        user_name: name,
        user_email: currentUser.email,
        mood,
        answer: text
      }]);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "ideas");
    }

    async function addComment(eventId, eventIndex) {
      const name = document.getElementById("commentName").value.trim() || currentProfile?.full_name || "Guest";
      const mood = document.getElementById("commentMood").value;
      const text = document.getElementById("commentText").value.trim();
      if (!text) return;

      const { error } = await supabaseClient.from("comments").insert([{
        event_id: eventId,
        user_name: name,
        user_email: currentUser.email,
        mood,
        comment: text
      }]);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "ideas");
    }

    async function likeAnswer(answerId, eventIndex) {
      const target = Object.values(answersByPrompt).flat().find(a => a.id === answerId);
      if (!target) return;

      const { error } = await supabaseClient
        .from("prompt_answers")
        .update({ likes_count: (target.likes_count || 0) + 1 })
        .eq("id", answerId);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "ideas");
    }

    async function likeComment(commentId, eventIndex) {
      const target = Object.values(commentsByEvent).flat().find(c => c.id === commentId);
      if (!target) return;

      const { error } = await supabaseClient
        .from("comments")
        .update({ likes_count: (target.likes_count || 0) + 1 })
        .eq("id", commentId);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "ideas");
    }

    async function sendMessage(eventId, isSelf, eventIndex) {
      const text = document.getElementById("chatMessage").value.trim();
      const name = document.getElementById("chatName").value.trim() || currentProfile?.full_name || (isSelf ? "You" : "Guest");
      if (!text) return;

      const { error } = await supabaseClient.from("chat_messages").insert([{
        event_id: eventId,
        user_name: name,
        user_email: currentUser.email,
        is_self: !!isSelf,
        message: text
      }]);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "chat");
    }

    async function join(eventId, eventIndex) {
      const name = document.getElementById("joinName").value.trim() || currentProfile?.full_name;
      if (!name) return alert("Please add your name first ✨");

      const { error } = await supabaseClient.from("join_requests").insert([{
        event_id: eventId,
        guest_name: name,
        guest_email: currentUser.email
      }]);

      if (error) return alert(error.message);

      alert("Request sent 💛");
      await loadAllData();
      openEvent(eventIndex, "people");
    }

    async function updateJoinRequest(requestId, status, eventIndex) {
      const { error } = await supabaseClient
        .from("join_requests")
        .update({ status })
        .eq("id", requestId);

      if (error) return alert(error.message);

      await loadAllData();
      openEvent(eventIndex, "people");
    }

    async function deleteEvent(eventId) {
      const confirmed = confirm("Delete this gathering?");
      if (!confirmed) return;

      const { error } = await supabaseClient.from("events").delete().eq("id", eventId);
      if (error) return alert(error.message);

      await loadAllData();
      renderProfile();
    }

    async function deleteAllEvents() {
      const confirmed = confirm("Delete all gatherings?");
      if (!confirmed) return;

      const ids = events.map(e => e.id);
      if (!ids.length) return;

      const { error } = await supabaseClient.from("events").delete().in("id", ids);
      if (error) return alert(error.message);

      await loadAllData();
      renderHome();
    }

    function copySummary(eventIndex) {
      const event = events[eventIndex];
      if (!event) return;

      const topPicks = getTopPicks(event.id);
      const chat = chatByEvent[event.id] || [];

      let summary = `${event.title}\n`;
      summary += `${event.description || ""}\n`;
      if (event.event_date) summary += `Date: ${event.event_date}\n`;
      if (event.event_time) summary += `Time: ${event.event_time}\n`;
      if (event.location) summary += `Location: ${event.location}\n`;
      summary += `Vibe: ${event.vibe || "Meaningful"}\n`;
      summary += `Mood: ${event.event_mood || "Chill"}\n\n`;

      if (event.host_note) summary += `Host note:\n${event.host_note}\n\n`;

      summary += `Top picks:\n`;
      if (topPicks.length === 0) {
        summary += `- No suggestions yet\n`;
      } else {
        topPicks.forEach(item => {
          summary += `- ${item.text} (${item.name}, ${item.type}, ❤️ ${item.likes})\n`;
        });
      }

      summary += `\nChat messages:\n`;
      if (!chat.length) {
        summary += `- No messages yet\n`;
      } else {
        chat.forEach(msg => {
          summary += `- ${msg.user_name}: ${msg.message}\n`;
        });
      }

      navigator.clipboard.writeText(summary)
        .then(() => alert("Summary copied ✨"))
        .catch(() => alert("Copy didn’t work automatically."));
    }

    function routeAfterAuth() {
      if (!profileIsComplete(currentProfile)) {
        renderCompleteProfile();
      } else {
        renderHome();
      }
    }

    async function bootstrap() {
      const { data } = await supabaseClient.auth.getSession();
      currentUser = data.session?.user || null;

      supabaseClient.auth.onAuthStateChange(async (_event, session) => {
        currentUser = session?.user || null;

        if (!currentUser) {
          currentProfile = null;
          renderLogin();
          return;
        }

        await ensureProfileRow();
        await loadProfile();
        await loadAllData();
        routeAfterAuth();
      });

      if (!currentUser) {
        renderLogin();
        return;
      }

      await ensureProfileRow();
      await loadProfile();
      await loadAllData();
      routeAfterAuth();
    }

    document.getElementById("homeTab").addEventListener("click", renderHome);
    document.getElementById("createTab").addEventListener("click", renderCreate);
    document.getElementById("profileTab").addEventListener("click", renderProfile);

    bootstrap();
  </script>
</body>
</html>
