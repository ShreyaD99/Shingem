<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindred</title>
  <style>
    :root {
      --bg: #fbf7f3;
      --bg-2: #f4ede7;
      --card: rgba(255, 255, 255, 0.82);
      --card-solid: #ffffff;
      --text: #231f1c;
      --text-soft: #6d655f;
      --accent: #dcc6b2;
      --accent-2: #f2e7dc;
      --accent-3: #ede3da;
      --border: rgba(120, 100, 82, 0.10);
      --shadow: 0 10px 30px rgba(70, 54, 42, 0.08);
      --shadow-soft: 0 6px 18px rgba(70, 54, 42, 0.05);
      --dark: #1d1a18;
      --danger: #9f4b4b;
      --like: #c86d7a;
      --pill: #f5eee7;
      --gold: #b9925c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fffaf5 0%, transparent 35%),
        radial-gradient(circle at top right, #f7efe7 0%, transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #f8f2eb 100%);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 22px 20px 20px;
      text-align: center;
      color: white;
      background:
        linear-gradient(135deg, rgba(28,24,22,0.96), rgba(62,48,39,0.92)),
        radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 40%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 10px 30px rgba(28, 24, 22, 0.18);
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 13px;
      opacity: 0.88;
      letter-spacing: 0.2px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 16px 110px;
    }

    .screen-title {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 2px 16px;
      color: var(--text);
    }

    .screen-subtitle {
      margin: -8px 2px 18px;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .event-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }

    .event-description {
      margin-top: 8px;
      color: var(--text-soft);
      line-height: 1.55;
      font-size: 14px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill);
      color: #5f544b;
      border: 1px solid rgba(120, 100, 82, 0.08);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .section-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .section-note {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.45;
      margin-top: -2px;
      margin-bottom: 10px;
    }

    .host-note {
      background: linear-gradient(180deg, #f8f1ea 0%, #f5ede5 100%);
      border: 1px solid rgba(185, 146, 92, 0.14);
      border-left: 4px solid var(--gold);
      padding: 14px;
      border-radius: 16px;
      color: #54483f;
      line-height: 1.55;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .top-pick-item,
    .answer-item,
    .comment-item,
    .prompt-box {
      border-radius: 18px;
    }

    .top-pick-item {
      background: linear-gradient(180deg, #f7efe7 0%, #f4eadf 100%);
      border: 1px solid rgba(185, 146, 92, 0.14);
      padding: 13px 14px;
      margin-top: 10px;
      box-shadow: var(--shadow-soft);
    }

    .top-pick-title {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .top-pick-meta {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .prompt-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.76) 0%, rgba(249,244,239,0.92) 100%);
      border: 1px solid rgba(120, 100, 82, 0.09);
      padding: 14px;
      margin-top: 12px;
      box-shadow: var(--shadow-soft);
    }

    .prompt-question {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .answer-item,
    .comment-item {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(120, 100, 82, 0.08);
      padding: 12px;
      margin-top: 9px;
      box-shadow: 0 3px 10px rgba(70,54,42,0.03);
    }

    .item-line {
      line-height: 1.5;
      font-size: 14px;
      color: var(--text);
    }

    .item-line strong {
      color: var(--text);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .small-meta {
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.4;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(120, 100, 82, 0.12);
      background: rgba(255,255,255,0.92);
      color: var(--text);
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
      font-family: inherit;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9a8f86;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(185, 146, 92, 0.42);
      box-shadow: 0 0 0 4px rgba(220, 198, 178, 0.18);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.18s ease, box-shadow 0.18s ease;
      background: linear-gradient(135deg, #24201d 0%, #3d322a 100%);
      color: white;
      box-shadow: 0 8px 18px rgba(36, 32, 29, 0.18);
    }

    button:active {
      transform: scale(0.985);
    }

    button:hover {
      opacity: 0.96;
    }

    .secondary-btn {
      background: linear-gradient(180deg, #f1e5d9 0%, #eadbcc 100%);
      color: #473d36;
      box-shadow: 0 8px 18px rgba(141, 116, 88, 0.12);
    }

    .like-btn,
    .tiny-btn {
      width: auto;
      padding: 8px 12px;
      margin-top: 0;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      background: white;
      color: var(--like);
      border: 1px solid rgba(200,109,122,0.18);
      box-shadow: none;
    }

    .danger-btn {
      background: linear-gradient(135deg, #8f4949 0%, #a34f4f 100%);
      color: white;
      box-shadow: 0 8px 18px rgba(143, 73, 73, 0.18);
    }

    .empty {
      text-align: center;
      color: var(--text-soft);
      padding: 38px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.7);
      border: 1px dashed rgba(120,100,82,0.18);
      box-shadow: var(--shadow-soft);
    }

    .small-text {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120,100,82,0.12), transparent);
      margin: 16px 0;
    }

    .tabs {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(92vw, 520px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(120,100,82,0.10);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(70,54,42,0.10);
      z-index: 30;
    }

    .tabs button {
      width: 100%;
      margin-top: 0;
      padding: 11px 12px;
      border-radius: 14px;
      background: transparent;
      color: #544941;
      box-shadow: none;
      font-weight: 700;
    }

    .tabs button.active {
      background: linear-gradient(180deg, #f1e5d9 0%, #eadbcc 100%);
      color: #40362f;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .hero-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.86) 0%, rgba(249,243,236,0.88) 100%);
      border: 1px solid rgba(120,100,82,0.09);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .hero-copy {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px 14px 110px;
      }

      header {
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
      }

      .card,
      .hero-card {
        padding: 16px;
        border-radius: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .event-title {
        font-size: 18px;
      }

      .screen-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kindred ✨</h1>
    <p>building your chosen family</p>
  </header>

  <div class="container" id="app"></div>

  <div class="tabs">
    <button id="homeTab" class="active">Home</button>
    <button id="createTab">Create</button>
    <button id="profileTab">Profile</button>
  </div>

  <script>
    const STORAGE_KEY = "kindred_events_v7";
    let events = [];

    try {
      events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      events = [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setActiveTab(tab) {
      document.getElementById("homeTab").classList.remove("active");
      document.getElementById("createTab").classList.remove("active");
      document.getElementById("profileTab").classList.remove("active");

      if (tab === "home") document.getElementById("homeTab").classList.add("active");
      if (tab === "create") document.getElementById("createTab").classList.add("active");
      if (tab === "profile") document.getElementById("profileTab").classList.add("active");
    }

    function showTab(tab) {
      setActiveTab(tab);
      if (tab === "home") renderHome();
      if (tab === "create") renderCreate();
      if (tab === "profile") renderProfile();
    }

    function defaultPrompts() {
      return [
        { question: "What movie should we watch?", answers: [] },
        { question: "What game should we play?", answers: [] },
        { question: "What music should we have in the background?", answers: [] },
        { question: "What would you love us to talk about?", answers: [] }
      ];
    }

    function buildAnswer(name, text, mood) {
      return {
        name: name || "Guest",
        text: text,
        mood: mood || "Chill",
        likes: 0
      };
    }

    function buildComment(name, text, mood) {
      return {
        name: name || "Guest",
        text: text,
        mood: mood || "Chill",
        likes: 0
      };
    }

    function getTopPicks(event) {
      const picks = [];

      (event.prompts || []).forEach(prompt => {
        (prompt.answers || []).forEach(answer => {
          picks.push({
            type: prompt.question,
            name: answer.name,
            text: answer.text,
            likes: answer.likes || 0,
            mood: answer.mood || ""
          });
        });
      });

      (event.guestComments || []).forEach(comment => {
        picks.push({
          type: "Guest comment",
          name: comment.name,
          text: comment.text,
          likes: comment.likes || 0,
          mood: comment.mood || ""
        });
      });

      return picks.sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 3);
    }

    function renderHome() {
      const app = document.getElementById("app");
      let html = `
        <div class="hero-card">
          <div class="hero-title">Create evenings people want to remember.</div>
          <div class="hero-copy">
            Gather ideas, shape the vibe, and plan intentional moments that feel warm, thoughtful, and easy.
          </div>
        </div>

        <div class="screen-title">Upcoming gatherings</div>
        <div class="screen-subtitle">Thoughtful plans, soft energy, and a little room for serendipity.</div>
      `;

      if (events.length === 0) {
        html += `<div class="empty">No gatherings yet — create one ✨</div>`;
      } else {
        events.forEach((event, eventIndex) => {
          const title = escapeHtml(event.title || "Untitled gathering");
          const vibe = escapeHtml(event.vibe || "Meaningful");
          const description = escapeHtml(event.description || "A warm space to connect.");
          const hostNote = escapeHtml(event.hostNote || "");
          const topPicks = getTopPicks(event);

          html += `
            <div class="card">
              <div class="event-title">${title}</div>
              <div class="event-description">${description}</div>

              <div class="meta-row">
                <div class="pill">✨ ${vibe}</div>
                ${event.eventMood ? `<div class="pill">☁️ ${escapeHtml(event.eventMood)}</div>` : ""}
              </div>

              ${hostNote ? `
                <div class="section-title">From the host</div>
                <div class="host-note">${hostNote}</div>
              ` : ""}

              <div class="section-title">Top picks</div>
              ${
                topPicks.length === 0
                  ? `<div class="small-text">No suggestions yet — be the first ✨</div>`
                  : topPicks.map(item => `
                    <div class="top-pick-item">
                      <div class="top-pick-title">${escapeHtml(item.text)}</div>
                      <div class="top-pick-meta">
                        ${escapeHtml(item.name)} • ${escapeHtml(item.type)}${item.mood ? ` • ${escapeHtml(item.mood)}` : ""} • ❤️ ${item.likes}
                      </div>
                    </div>
                  `).join("")
              }

              <div class="section-title">Prompts for the evening</div>
          `;

          (event.prompts || []).forEach((prompt, promptIndex) => {
            html += `
              <div class="prompt-box">
                <div class="prompt-question">${escapeHtml(prompt.question)}</div>

                ${(prompt.answers || []).map((answer, answerIndex) => `
                  <div class="answer-item">
                    <div class="item-line"><strong>${escapeHtml(answer.name)}</strong>: ${escapeHtml(answer.text)}</div>
                    <div class="row">
                      ${answer.mood ? `<span class="pill">${escapeHtml(answer.mood)}</span>` : ""}
                      <button class="like-btn" onclick="likeAnswer(${eventIndex}, ${promptIndex}, ${answerIndex})">❤️ ${answer.likes || 0}</button>
                    </div>
                  </div>
                `).join("")}

                <input id="answer-name-${eventIndex}-${promptIndex}" placeholder="Your name" />
                <select id="answer-mood-${eventIndex}-${promptIndex}">
                  <option>Chill</option>
                  <option>Fun</option>
                  <option>Deep talk</option>
                  <option>Cozy</option>
                  <option>Party</option>
                </select>
                <input id="answer-${eventIndex}-${promptIndex}" placeholder="Add your idea..." />
                <button class="secondary-btn" onclick="addAnswer(${eventIndex}, ${promptIndex})">Add Answer</button>
              </div>
            `;
          });

          html += `
              <div class="section-title">Add your own question or comment</div>

              ${(event.guestComments || []).map((comment, commentIndex) => `
                <div class="comment-item">
                  <div class="item-line"><strong>${escapeHtml(comment.name)}</strong>: ${escapeHtml(comment.text)}</div>
                  <div class="row">
                    ${comment.mood ? `<span class="pill">${escapeHtml(comment.mood)}</span>` : ""}
                    <button class="like-btn" onclick="likeComment(${eventIndex}, ${commentIndex})">❤️ ${comment.likes || 0}</button>
                  </div>
                </div>
              `).join("")}

              <input id="comment-name-${eventIndex}" placeholder="Your name" />
              <select id="comment-mood-${eventIndex}">
                <option>Chill</option>
                <option>Fun</option>
                <option>Deep talk</option>
                <option>Cozy</option>
                <option>Party</option>
              </select>
              <textarea id="comment-${eventIndex}" placeholder="Share a thought, suggestion, or question..."></textarea>
              <button class="secondary-btn" onclick="addComment(${eventIndex})">Add Comment</button>

              <div class="divider"></div>
              <button onclick="join(${eventIndex})">Request to Join</button>
              <button class="secondary-btn" onclick="copySummary(${eventIndex})">Copy Event Summary</button>
            </div>
          `;
        });
      }

      app.innerHTML = html;
    }

    function renderCreate() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="screen-title">Create a gathering</div>
        <div class="screen-subtitle">Set the tone, shape the mood, and give people something lovely to step into.</div>

        <div class="card">
          <input id="title" placeholder="Ladies Evening ✨" />
          <div class="form-grid">
            <input id="vibe" placeholder="Cozy, meaningful, fun..." />
            <select id="eventMood">
              <option>Chill</option>
              <option>Fun</option>
              <option>Deep talk</option>
              <option>Cozy</option>
              <option>Party</option>
            </select>
          </div>

          <textarea id="desc" placeholder="What makes this gathering special?"></textarea>
          <textarea id="hostNote" placeholder="Host note: what kind of evening are you imagining?"></textarea>

          <div class="section-title">Default prompts</div>
          <div class="section-note">
            These help guests contribute ideas before the evening begins.
          </div>
          <div class="small-text">• What movie should we watch?</div>
          <div class="small-text">• What game should we play?</div>
          <div class="small-text">• What music should we have in the background?</div>
          <div class="small-text">• What would you love us to talk about?</div>

          <button id="createGatheringBtn">Create Gathering</button>
        </div>
      `;

      document.getElementById("createGatheringBtn").addEventListener("click", createEvent);
    }

    function renderProfile() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="screen-title">Your space</div>
        <div class="screen-subtitle">A quiet place to manage your gatherings and reset things when needed.</div>

        <div class="card">
          <div style="font-size:18px; font-weight:700;">${events.length} gathering${events.length === 1 ? "" : "s"} created so far ✨</div>
          <div class="section-note">Admin tools live here only on your device for now.</div>
          <button id="resetBtn" class="danger-btn">Delete All Gatherings</button>
        </div>

        <div class="card">
          <div class="section-title" style="margin-top:0;">Manage gatherings</div>
          ${
            events.length === 0
              ? `<div class="small-text">No gatherings to manage yet.</div>`
              : events.map((event, index) => `
                  <div class="prompt-box">
                    <div class="prompt-question">${escapeHtml(event.title)}</div>
                    <div class="small-text">${escapeHtml(event.description || "")}</div>
                    <button class="danger-btn" onclick="deleteEvent(${index})">Delete This Gathering</button>
                  </div>
                `).join("")
          }
        </div>
      `;

      document.getElementById("resetBtn").addEventListener("click", function () {
        const confirmed = confirm("Delete all gatherings?");
        if (!confirmed) return;
        localStorage.removeItem(STORAGE_KEY);
        events = [];
        showTab("home");
      });
    }

    function createEvent() {
      const title = document.getElementById("title").value.trim();
      const vibe = document.getElementById("vibe").value.trim();
      const description = document.getElementById("desc").value.trim();
      const hostNote = document.getElementById("hostNote").value.trim();
      const eventMood = document.getElementById("eventMood").value;

      if (!title) {
        alert("Please add a gathering name ✨");
        return;
      }

      const newEvent = {
        title: title,
        vibe: vibe || "Meaningful",
        eventMood: eventMood || "Chill",
        description: description || "A warm space to connect.",
        hostNote: hostNote || "",
        prompts: defaultPrompts(),
        guestComments: [],
        joinRequests: []
      };

      events.unshift(newEvent);
      save();
      alert("Gathering created ✨");
      showTab("home");
    }

    function addAnswer(eventIndex, promptIndex) {
      const nameInput = document.getElementById(`answer-name-${eventIndex}-${promptIndex}`);
      const moodInput = document.getElementById(`answer-mood-${eventIndex}-${promptIndex}`);
      const textInput = document.getElementById(`answer-${eventIndex}-${promptIndex}`);

      if (!textInput) return;

      const name = nameInput.value.trim() || "Guest";
      const mood = moodInput.value;
      const text = textInput.value.trim();

      if (!text) return;

      events[eventIndex].prompts[promptIndex].answers.push(buildAnswer(name, text, mood));
      save();
      renderHome();
    }

    function addComment(eventIndex) {
      const nameInput = document.getElementById(`comment-name-${eventIndex}`);
      const moodInput = document.getElementById(`comment-mood-${eventIndex}`);
      const textInput = document.getElementById(`comment-${eventIndex}`);

      if (!textInput) return;

      const name = nameInput.value.trim() || "Guest";
      const mood = moodInput.value;
      const text = textInput.value.trim();

      if (!text) return;

      events[eventIndex].guestComments.push(buildComment(name, text, mood));
      save();
      renderHome();
    }

    function likeAnswer(eventIndex, promptIndex, answerIndex) {
      events[eventIndex].prompts[promptIndex].answers[answerIndex].likes += 1;
      save();
      renderHome();
    }

    function likeComment(eventIndex, commentIndex) {
      events[eventIndex].guestComments[commentIndex].likes += 1;
      save();
      renderHome();
    }

    function join(index) {
      const event = events[index];
      const title = event ? event.title : "this gathering";
      alert(`Request sent for "${title}" 💛`);
    }

    function deleteEvent(index) {
      const confirmed = confirm("Delete this gathering?");
      if (!confirmed) return;
      events.splice(index, 1);
      save();
      showTab("profile");
    }

    function copySummary(eventIndex) {
      const event = events[eventIndex];
      if (!event) return;

      const topPicks = getTopPicks(event);

      let summary = `${event.title}\n`;
      summary += `${event.description || ""}\n`;
      summary += `Vibe: ${event.vibe || "Meaningful"}\n`;
      summary += `Mood: ${event.eventMood || "Chill"}\n\n`;

      if (event.hostNote) {
        summary += `Host note:\n${event.hostNote}\n\n`;
      }

      summary += `Top picks:\n`;
      if (topPicks.length === 0) {
        summary += `- No suggestions yet\n`;
      } else {
        topPicks.forEach(item => {
          summary += `- ${item.text} (${item.name}, ${item.type}, ❤️ ${item.likes})\n`;
        });
      }

      summary += `\nGuest comments:\n`;
      if (!event.guestComments || event.guestComments.length === 0) {
        summary += `- None yet\n`;
      } else {
        event.guestComments.forEach(comment => {
          summary += `- ${comment.name}: ${comment.text} (❤️ ${comment.likes})\n`;
        });
      }

      navigator.clipboard.writeText(summary)
        .then(() => alert("Summary copied ✨"))
        .catch(() => {
          alert("Copy didn’t work automatically. You can manually copy from your browser if needed.");
        });
    }

    document.getElementById("homeTab").addEventListener("click", function () {
      showTab("home");
    });

    document.getElementById("createTab").addEventListener("click", function () {
      showTab("create");
    });

    document.getElementById("profileTab").addEventListener("click", function () {
      showTab("profile");
    });

    showTab("home");
  </script>
</body>
</html>
