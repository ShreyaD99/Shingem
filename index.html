<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nest</title>
  <style>
    :root{
      --bg:#f8f6f2;
      --card:#ffffff;
      --text:#111111;
      --muted:#6f6a64;
      --line:#e9e2d8;
      --gold:#b89a63;
      --gold-soft:#efe6d8;
      --black:#121212;
      --shadow:0 10px 30px rgba(17,17,17,0.06);
      --shadow-soft:0 6px 18px rgba(17,17,17,0.04);
      --danger:#9b5d5d;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
      background:
        radial-gradient(circle at top left, #fffdf9 0%, transparent 28%),
        linear-gradient(180deg, #fcfaf7 0%, var(--bg) 100%);
      color:var(--text);
      min-height:100vh;
    }

    .app-shell{
      max-width:820px;
      margin:0 auto;
      padding:20px 16px 110px;
    }

    .fade{
      animation:fade .22s ease;
    }

    @keyframes fade{
      from{opacity:0; transform:translateY(5px)}
      to{opacity:1; transform:translateY(0)}
    }

    .logo-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .logo-card,
    .card,
    .choice-card,
    .event-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
    }

    .logo-card{
      width:100%;
      max-width:460px;
      padding:34px 24px 28px;
      text-align:center;
    }

    .logo-mark{
      width:72px;
      height:72px;
      margin:0 auto 18px;
      border-radius:22px;
      background:linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:700;
      box-shadow:var(--shadow);
    }

    .brand{
      font-size:32px;
      font-weight:700;
      letter-spacing:-0.04em;
      margin-bottom:6px;
    }

    .tagline{
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      margin-bottom:24px;
    }

    .card{
      padding:18px;
      margin-bottom:16px;
    }

    .screen-title{
      font-size:24px;
      font-weight:700;
      letter-spacing:-0.03em;
      margin:2px 2px 8px;
    }

    .screen-subtitle{
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
      margin:0 2px 18px;
    }

    input, textarea, select{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:13px 14px;
      font-size:14px;
      margin-bottom:12px;
      outline:none;
      font-family:inherit;
      color:var(--text);
    }

    textarea{
      min-height:100px;
      resize:vertical;
      line-height:1.5;
    }

    input:focus, textarea:focus, select:focus{
      border-color:#d8c7a7;
      box-shadow:0 0 0 4px rgba(184,154,99,0.12);
    }

    button{
      width:100%;
      border:none;
      border-radius:18px;
      padding:13px 14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      background:linear-gradient(135deg, #111111 0%, #222222 100%);
      color:white;
      box-shadow:0 8px 18px rgba(17,17,17,0.12);
    }

    button:active{
      transform:scale(.985);
    }

    .secondary{
      background:linear-gradient(180deg, #f4eee4 0%, #eadfcf 100%);
      color:#3d342b;
      box-shadow:none;
    }

    .danger{
      background:linear-gradient(135deg, #8f5a5a 0%, #a76969 100%);
      color:#fff;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:40;
      margin-bottom:18px;
      padding:16px 4px 6px;
      background:rgba(248,246,242,0.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .topbar-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .topbar-left{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .topbar-brand{
      font-size:22px;
      font-weight:700;
      letter-spacing:-0.03em;
    }

    .topbar-tag{
      font-size:12px;
      color:var(--muted);
    }

    .topbar-user{
      font-size:12px;
      color:var(--muted);
      text-align:right;
    }

    .choice-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .choice-card{
      padding:22px 18px;
      cursor:pointer;
      transition:transform .14s ease, box-shadow .14s ease;
    }

    .choice-card:active{
      transform:scale(.99);
    }

    .choice-icon{
      width:48px;
      height:48px;
      border-radius:16px;
      background:var(--gold-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      margin-bottom:14px;
    }

    .choice-title{
      font-size:18px;
      font-weight:700;
      letter-spacing:-0.02em;
      margin-bottom:6px;
    }

    .choice-copy{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .event-card{
      padding:18px;
      margin-bottom:14px;
    }

    .event-title{
      font-size:19px;
      font-weight:700;
      letter-spacing:-0.02em;
      margin-bottom:8px;
    }

    .event-copy{
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
      margin-bottom:10px;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 11px;
      border-radius:999px;
      background:#f6f0e8;
      border:1px solid #eee4d7;
      color:#564d44;
      font-size:12px;
      font-weight:600;
    }

    .section-title{
      font-size:15px;
      font-weight:700;
      margin:18px 0 10px;
    }

    .subtabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:16px 0 14px;
    }

    .subtabs button{
      width:auto;
      margin:0;
      padding:10px 14px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      color:#564d44;
      box-shadow:none;
    }

    .subtabs button.active{
      background:linear-gradient(180deg, #f4eee4 0%, #eadfcf 100%);
      color:#372f27;
    }

    .box{
      background:#fcfaf7;
      border:1px solid var(--line);
      border-radius:20px;
      padding:14px;
      margin-bottom:12px;
    }

    .item{
      background:#fff;
      border:1px solid #eee6dc;
      border-radius:16px;
      padding:12px;
      margin-top:10px;
    }

    .item-line{
      font-size:14px;
      line-height:1.5;
    }

    .small{
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:8px;
    }

    .tiny{
      width:auto;
      padding:8px 12px;
      margin:0;
      border-radius:999px;
      box-shadow:none;
      font-size:12px;
    }

    .chat-wrap{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }

    .bubble{
      max-width:82%;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid #eee6dc;
      background:#fff;
      box-shadow:var(--shadow-soft);
      font-size:14px;
      line-height:1.45;
    }

    .bubble.self{
      align-self:flex-end;
      background:#efe3d6;
    }

    .bubble.other{
      align-self:flex-start;
    }

    .bubble-name{
      font-size:12px;
      font-weight:700;
      color:#655c55;
      margin-bottom:4px;
    }

    .empty{
      text-align:center;
      padding:36px 18px;
      border-radius:24px;
      background:#fff;
      border:1px dashed #eadfd2;
      color:var(--muted);
    }

    .tabs{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:16px;
      width:min(92vw,520px);
      display:flex;
      gap:8px;
      padding:8px;
      background:rgba(255,255,255,0.84);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(0,0,0,0.06);
      border-radius:22px;
      box-shadow:0 18px 40px rgba(17,17,17,0.08);
      z-index:50;
    }

    .tabs button{
      width:100%;
      margin:0;
      padding:11px 12px;
      border-radius:14px;
      background:transparent;
      color:#5b534b;
      box-shadow:none;
    }

    .tabs button.active{
      background:linear-gradient(180deg, #f4eee4 0%, #eadfcf 100%);
      color:#2f2924;
    }

    @media (max-width:640px){
      .choice-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const USERS_KEY = "nest_v5_users";
    const EVENTS_KEY = "nest_v5_events";
    const SESSION_KEY = "nest_v5_session";

    let users = JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
    let events = JSON.parse(localStorage.getItem(EVENTS_KEY) || "[]");
    let session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");

    function saveUsers(){ localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
    function saveEvents(){ localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); }
    function saveSession(){ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }

    function escapeHtml(text){
      return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function nowTime(){
      return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function currentUser(){
      if(!session) return null;
      return users.find(u => u.email === session.email) || null;
    }

    function getEvent(index){
      return events[index];
    }

    function topBar(){
      const user = currentUser();
      return `
        <div class="topbar">
          <div class="topbar-row">
            <div class="topbar-left">
              <div class="topbar-brand">Nest</div>
              <div class="topbar-tag">a place to build your chosen family</div>
            </div>
            <div class="topbar-user">
              ${user ? `${escapeHtml(user.name || user.email)}` : ""}
            </div>
          </div>
        </div>
      `;
    }

    function setBottomTab(tab){
      const ids = ["homeTab","createTab","profileTab"];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.classList.remove("active");
      });
      const active = document.getElementById(tab + "Tab");
      if(active) active.classList.add("active");
    }

    function authScreen(){
      document.getElementById("app").innerHTML = `
        <div class="logo-wrap fade">
          <div class="logo-card">
            <div class="logo-mark">N</div>
            <div class="brand">Nest</div>
            <div class="tagline">a place to build your chosen family</div>

            <input id="loginEmail" placeholder="Email" />
            <input id="loginPassword" type="password" placeholder="Password" />
            <button onclick="loginUser()">Log In</button>
            <button class="secondary" onclick="showSignup()">Create Account</button>
          </div>
        </div>
      `;
    }

    function showSignup(){
      document.getElementById("app").innerHTML = `
        <div class="logo-wrap fade">
          <div class="logo-card">
            <div class="logo-mark">N</div>
            <div class="brand">Nest</div>
            <div class="tagline">Create your account</div>

            <input id="signupName" placeholder="Full name" />
            <input id="signupEmail" placeholder="Email" />
            <input id="signupPassword" type="password" placeholder="Password" />
            <button onclick="signupUser()">Create Account</button>
            <button class="secondary" onclick="authScreen()">Back to Login</button>
          </div>
        </div>
      `;
    }

    function signupUser(){
      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;

      if(!name || !email || !password){
        alert("Please complete all fields.");
        return;
      }

      if(users.find(u => u.email === email)){
        alert("An account with this email already exists.");
        return;
      }

      users.push({ name, email, password });
      saveUsers();
      session = { email };
      saveSession();
      homeChoiceScreen();
    }

    function loginUser(){
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const user = users.find(u => u.email === email && u.password === password);
      if(!user){
        alert("Incorrect email or password.");
        return;
      }

      session = { email };
      saveSession();
      homeChoiceScreen();
    }

    function logoutUser(){
      session = null;
      saveSession();
      authScreen();
    }

    function homeChoiceScreen(){
      if(!currentUser()){
        authScreen();
        return;
      }

      document.getElementById("app").innerHTML = `
        <div class="app-shell fade">
          ${topBar()}

          <div class="screen-title">What would you like to do?</div>
          <div class="screen-subtitle">Keep it simple. Organize something beautiful or explore what’s happening.</div>

          <div class="choice-grid">
            <div class="choice-card" onclick="renderCreateEvent()">
              <div class="choice-icon">✦</div>
              <div class="choice-title">Organize event</div>
              <div class="choice-copy">Create a gathering, choose the vibe, and add details for tomorrow or later.</div>
            </div>

            <div class="choice-card" onclick="renderViewEvents()">
              <div class="choice-icon">◌</div>
              <div class="choice-title">View events</div>
              <div class="choice-copy">Explore gatherings, join them, and add ideas, games, or chat.</div>
            </div>
          </div>
        </div>

        <div class="tabs">
          <button id="homeTab" class="active" onclick="homeChoiceScreen()">Home</button>
          <button id="createTab" onclick="renderCreateEvent()">Create</button>
          <button id="profileTab" onclick="renderProfile()">Profile</button>
        </div>
      `;
    }

    function renderViewEvents(){
      if(!currentUser()) return authScreen();

      let html = `
        <div class="app-shell fade">
          ${topBar()}
          <div class="screen-title">Explore gatherings</div>
          <div class="screen-subtitle">Simple, calm, and easy to browse.</div>
      `;

      if(!events.length){
        html += `<div class="empty">No events yet — create one ✨</div>`;
      } else {
        events.forEach((event, index) => {
          html += `
            <div class="event-card">
              <div class="event-title">${escapeHtml(event.title)}</div>
              <div class="event-copy">${escapeHtml(event.description || "A warm space to connect.")}</div>

              <div class="meta">
                ${event.vibe ? `<div class="pill">✨ ${escapeHtml(event.vibe)}</div>` : ""}
                ${event.date ? `<div class="pill">📅 ${escapeHtml(event.date)}</div>` : ""}
                ${event.time ? `<div class="pill">🕒 ${escapeHtml(event.time)}</div>` : ""}
                ${event.game ? `<div class="pill">🎲 ${escapeHtml(event.game)}</div>` : ""}
              </div>

              <button onclick="openEvent(${index}, 'chat')">Open Event</button>
            </div>
          `;
        });
      }

      html += `</div>
        <div class="tabs">
          <button id="homeTab" onclick="homeChoiceScreen()">Home</button>
          <button id="createTab" onclick="renderCreateEvent()">Create</button>
          <button id="profileTab" onclick="renderProfile()">Profile</button>
        </div>
      `;

      document.getElementById("app").innerHTML = html;
      setBottomTab("home");
    }

    function renderCreateEvent(){
      if(!currentUser()) return authScreen();

      document.getElementById("app").innerHTML = `
        <div class="app-shell fade">
          ${topBar()}
          <div class="screen-title">Organize a gathering</div>
          <div class="screen-subtitle">Keep it beautiful, minimal, and clear.</div>

          <div class="card">
            <input id="eventTitle" placeholder="Event name" />
            <input id="eventVibe" placeholder="Vibe (cozy, fun, meaningful)" />

            <div class="row">
              <div style="flex:1; min-width:140px;">
                <input id="eventDate" placeholder="Date" />
              </div>
              <div style="flex:1; min-width:140px;">
                <input id="eventTime" placeholder="Time" />
              </div>
            </div>

            <input id="eventLocation" placeholder="Location" />
            <textarea id="eventDescription" placeholder="What makes this gathering special?"></textarea>

            <div class="section-title">Game option for tomorrow</div>
            <select id="eventGame">
              <option value="">Select a game</option>
              <option value="Cards Against Humanity">Cards Against Humanity</option>
              <option value="What Do You Meme?">What Do You Meme?</option>
              <option value="Codenames">Codenames</option>
              <option value="Taboo">Taboo</option>
              <option value="We’re Not Really Strangers">We’re Not Really Strangers</option>
              <option value="Uno">Uno</option>
              <option value="Charades">Charades</option>
              <option value="Mafia">Mafia</option>
            </select>

            <textarea id="eventHostNote" placeholder="Host note (optional)"></textarea>

            <button onclick="createEvent()">Create Event</button>
          </div>
        </div>

        <div class="tabs">
          <button id="homeTab" onclick="homeChoiceScreen()">Home</button>
          <button id="createTab" class="active" onclick="renderCreateEvent()">Create</button>
          <button id="profileTab" onclick="renderProfile()">Profile</button>
        </div>
      `;
      setBottomTab("create");
    }

    function createEvent(){
      const user = currentUser();
      const title = document.getElementById("eventTitle").value.trim();
      const vibe = document.getElementById("eventVibe").value.trim();
      const date = document.getElementById("eventDate").value.trim();
      const time = document.getElementById("eventTime").value.trim();
      const location = document.getElementById("eventLocation").value.trim();
      const description = document.getElementById("eventDescription").value.trim();
      const game = document.getElementById("eventGame").value;
      const hostNote = document.getElementById("eventHostNote").value.trim();

      if(!title){
        alert("Please add an event name.");
        return;
      }

      events.unshift({
        title,
        vibe,
        date,
        time,
        location,
        description,
        game,
        hostNote,
        hostEmail: user.email,
        prompts: [
          { question: "What movie should we watch?", answers: [] },
          { question: "What game should we play?", answers: [] },
          { question: "What music should we have in the background?", answers: [] },
          { question: "What would you love us to talk about?", answers: [] }
        ],
        comments: [],
        chat: [],
        joinRequests: []
      });

      saveEvents();
      alert("Event created ✨");
      renderViewEvents();
    }

    function openEvent(index, tab = "chat"){
      const event = getEvent(index);
      if(!event) return renderViewEvents();

      let html = `
        <div class="app-shell fade">
          ${topBar()}
          <div class="card">
            <button class="secondary" onclick="renderViewEvents()">← Back to Events</button>

            <div class="section-title" style="font-size:20px; margin-top:16px;">${escapeHtml(event.title)}</div>
            <div class="screen-subtitle" style="margin-bottom:10px;">${escapeHtml(event.description || "A warm space to connect.")}</div>

            <div class="meta">
              ${event.vibe ? `<div class="pill">✨ ${escapeHtml(event.vibe)}</div>` : ""}
              ${event.date ? `<div class="pill">📅 ${escapeHtml(event.date)}</div>` : ""}
              ${event.time ? `<div class="pill">🕒 ${escapeHtml(event.time)}</div>` : ""}
              ${event.location ? `<div class="pill">📍 ${escapeHtml(event.location)}</div>` : ""}
              ${event.game ? `<div class="pill">🎲 ${escapeHtml(event.game)}</div>` : ""}
            </div>

            ${event.hostNote ? `<div class="host-note">${escapeHtml(event.hostNote)}</div>` : ""}

            <div class="subtabs">
              <button class="${tab === "chat" ? "active" : ""}" onclick="openEvent(${index}, 'chat')">Chat</button>
              <button class="${tab === "ideas" ? "active" : ""}" onclick="openEvent(${index}, 'ideas')">Ideas</button>
              <button class="${tab === "people" ? "active" : ""}" onclick="openEvent(${index}, 'people')">People</button>
            </div>
      `;

      if(tab === "chat"){
        html += `
          <div class="section-title">Event chat</div>
          <div class="chat-wrap">
            ${
              !event.chat.length
                ? `<div class="small">No messages yet.</div>`
                : event.chat.map(msg => `
                    <div class="bubble ${msg.self ? "self" : "other"}">
                      ${!msg.self ? `<div class="bubble-name">${escapeHtml(msg.name)}</div>` : ""}
                      <div>${escapeHtml(msg.text)}</div>
                      <div class="small" style="margin-top:6px;">${escapeHtml(msg.time)}</div>
                    </div>
                  `).join("")
            }
          </div>

          <input id="chatName" placeholder="Your name" />
          <textarea id="chatText" placeholder="Write a message..."></textarea>
          <div class="row">
            <button class="secondary" onclick="sendMessage(${index}, false)">Send as guest</button>
            <button onclick="sendMessage(${index}, true)">Send as you</button>
          </div>
        `;
      }

      if(tab === "ideas"){
        html += `
          <div class="section-title">Prompt ideas</div>
        `;

        event.prompts.forEach((prompt, promptIndex) => {
          html += `
            <div class="box">
              <div style="font-weight:700; font-size:14px;">${escapeHtml(prompt.question)}</div>

              ${(prompt.answers || []).map(answer => `
                <div class="item">
                  <div class="item-line"><strong>${escapeHtml(answer.name)}</strong>: ${escapeHtml(answer.text)}</div>
                </div>
              `).join("")}

              <input id="answerName-${promptIndex}" placeholder="Your name" />
              <input id="answerText-${promptIndex}" placeholder="Add your idea" />
              <button class="secondary" onclick="addAnswer(${index}, ${promptIndex})">Add Answer</button>
            </div>
          `;
        });

        html += `
          <div class="section-title">Extra comments</div>
          ${(event.comments || []).map(comment => `
            <div class="item">
              <div class="item-line"><strong>${escapeHtml(comment.name)}</strong>: ${escapeHtml(comment.text)}</div>
            </div>
          `).join("")}

          <input id="commentName" placeholder="Your name" />
          <textarea id="commentText" placeholder="Add a comment or suggestion"></textarea>
          <button class="secondary" onclick="addComment(${index})">Add Comment</button>
        `;
      }

      if(tab === "people"){
        html += `
          <div class="section-title">Join requests</div>

          ${
            !event.joinRequests.length
              ? `<div class="small">No join requests yet.</div>`
              : event.joinRequests.map((req, reqIndex) => `
                  <div class="item">
                    <div class="item-line"><strong>${escapeHtml(req.name)}</strong></div>
                    <div class="small">Status: ${escapeHtml(req.status)}</div>
                    <div class="row">
                      <button class="secondary tiny" onclick="updateJoin(${index}, ${reqIndex}, 'approved')">Approve</button>
                      <button class="danger tiny" onclick="updateJoin(${index}, ${reqIndex}, 'declined')">Decline</button>
                    </div>
                  </div>
                `).join("")
          }

          <input id="joinName" placeholder="Your name" />
          <button onclick="requestJoin(${index})">Request to Join</button>
        `;
      }

      html += `
          </div>
        </div>

        <div class="tabs">
          <button id="homeTab" onclick="homeChoiceScreen()">Home</button>
          <button id="createTab" onclick="renderCreateEvent()">Create</button>
          <button id="profileTab" onclick="renderProfile()">Profile</button>
        </div>
      `;

      document.getElementById("app").innerHTML = html;
    }

    function sendMessage(index, self){
      const event = getEvent(index);
      const name = document.getElementById("chatName").value.trim() || (self ? "You" : "Guest");
      const text = document.getElementById("chatText").value.trim();
      if(!text) return;

      event.chat.push({
        name,
        text,
        self,
        time: nowTime()
      });

      saveEvents();
      openEvent(index, "chat");
    }

    function addAnswer(index, promptIndex){
      const event = getEvent(index);
      const name = document.getElementById(`answerName-${promptIndex}`).value.trim() || "Guest";
      const text = document.getElementById(`answerText-${promptIndex}`).value.trim();
      if(!text) return;

      event.prompts[promptIndex].answers.push({ name, text });
      saveEvents();
      openEvent(index, "ideas");
    }

    function addComment(index){
      const event = getEvent(index);
      const name = document.getElementById("commentName").value.trim() || "Guest";
      const text = document.getElementById("commentText").value.trim();
      if(!text) return;

      event.comments.push({ name, text });
      saveEvents();
      openEvent(index, "ideas");
    }

    function requestJoin(index){
      const event = getEvent(index);
      const name = document.getElementById("joinName").value.trim();
      if(!name){
        alert("Please add your name.");
        return;
      }

      event.joinRequests.push({ name, status: "pending" });
      saveEvents();
      alert("Request sent 💛");
      openEvent(index, "people");
    }

    function updateJoin(index, reqIndex, status){
      const event = getEvent(index);
      event.joinRequests[reqIndex].status = status;
      saveEvents();
      openEvent(index, "people");
    }

    function renderProfile(){
      const user = currentUser();
      if(!user) return authScreen();

      const myEvents = events.filter(e => e.hostEmail === user.email);

      document.getElementById("app").innerHTML = `
        <div class="app-shell fade">
          ${topBar()}
          <div class="screen-title">Profile</div>
          <div class="screen-subtitle">Simple account space.</div>

          <div class="card">
            <div class="section-title" style="margin-top:0;">${escapeHtml(user.name)}</div>
            <div class="small">${escapeHtml(user.email)}</div>
            <div class="small" style="margin-top:8px;">You organized ${myEvents.length} event${myEvents.length === 1 ? "" : "s"}.</div>
            <button class="secondary" onclick="logoutUser()">Log Out</button>
          </div>

          <div class="card">
            <div class="section-title" style="margin-top:0;">Manage your events</div>
            ${
              !myEvents.length
                ? `<div class="small">No events created yet.</div>`
                : myEvents.map(event => {
                    const realIndex = events.indexOf(event);
                    return `
                      <div class="item">
                        <div class="item-line"><strong>${escapeHtml(event.title)}</strong></div>
                        <div class="small">${escapeHtml(event.date || "")} ${escapeHtml(event.time || "")}</div>
                        <button class="danger" onclick="deleteEvent(${realIndex})">Delete Event</button>
                      </div>
                    `;
                  }).join("")
            }
          </div>
        </div>

        <div class="tabs">
          <button id="homeTab" onclick="homeChoiceScreen()">Home</button>
          <button id="createTab" onclick="renderCreateEvent()">Create</button>
          <button id="profileTab" class="active" onclick="renderProfile()">Profile</button>
        </div>
      `;
      setBottomTab("profile");
    }

    function deleteEvent(index){
      const ok = confirm("Delete this event?");
      if(!ok) return;
      events.splice(index, 1);
      saveEvents();
      renderProfile();
    }

    if(session && currentUser()){
      homeChoiceScreen();
    } else {
      authScreen();
    }
  </script>
</body>
</html>
