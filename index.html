<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindred</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f7f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .container {
      padding: 15px;
      padding-bottom: 80px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .vibe {
      font-size: 12px;
      background: #eee;
      padding: 5px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: white;
      position: fixed;
      bottom: 0;
      width: 100%;
      border-top: 1px solid #eee;
      padding: 8px 0;
    }

    .tabs button {
      background: none;
      color: #111;
      font-weight: 600;
      margin-top: 0;
      width: auto;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }

    small {
      color: #666;
      display: block;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<header>
  <h1>Kindred ✨</h1>
  <p>building your chosen family</p>
</header>

<div class="container" id="app"></div>

<div class="tabs">
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('create')">Create</button>
  <button onclick="showTab('profile')">Profile</button>
</div>

<script>
const STORAGE_KEY = "kindred_events";
let events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showTab(tab) {
  if (tab === "home") renderHome();
  if (tab === "create") renderCreate();
  if (tab === "profile") renderProfile();
}

function renderHome() {
  let html = "<h3>Upcoming gatherings</h3>";

  if (events.length === 0) {
    html += "<div class='empty'>No gatherings yet — create one ✨</div>";
  }

  events.forEach((event, i) => {
    const title = escapeHtml(event.title || "Untitled gathering");
    const description = escapeHtml(event.description || "A warm space to connect.");
    const vibe = escapeHtml(event.vibe || "Meaningful");

    html += `
      <div class="card">
        <b>${title}</b>
        <small>${description}</small>
        <div class="vibe">${vibe}</div>
        <button onclick="join(${i})">Request to Join</button>
      </div>
    `;
  });

  document.getElementById("app").innerHTML = html;
}

function renderCreate() {
  document.getElementById("app").innerHTML = `
    <h3>Create a gathering</h3>
    <input id="title" placeholder="Dinner, games, deep talk..." />
    <input id="vibe" placeholder="Cozy, fun, meaningful..." />
    <textarea id="desc" placeholder="What makes this gathering special?"></textarea>
    <button onclick="createEvent()">Create Gathering</button>
  `;
}

function renderProfile() {
  document.getElementById("app").innerHTML = `
    <h3>Your space</h3>
    <p>${events.length} gathering${events.length === 1 ? "" : "s"} created so far ✨</p>
    <p>Future: your circles, your people, your gatherings</p>
  `;
}

function createEvent() {
  const title = document.getElementById("title").value.trim();
  const vibe = document.getElementById("vibe").value.trim();
  const desc = document.getElementById("desc").value.trim();

  if (!title) {
    alert("Please add a gathering name ✨");
    return;
  }

  events.unshift({
    title,
    vibe: vibe || "Meaningful",
    description: desc || "A warm space to connect."
  });

  save();
  renderHome();
}

function join(index) {
  const event = events[index];
  const eventTitle = event?.title ? ` for "${event.title}"` : "";
  alert(`Request sent${eventTitle} 💛`);
}

showTab("home");
</script>

</body>
</html>
