<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gather</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="container">

    <h1>✨ Gather</h1>

    <!-- Create Gathering -->
    <div class="card">
      <h2>Create Gathering</h2>
      <input id="title" placeholder="Title" />
      <input id="description" placeholder="Description" />
      <input id="vibe" placeholder="Vibe (Cozy, Fun…)" />
      <button onclick="createGathering()">Create</button>
    </div>

    <!-- Home -->
    <div class="card">
      <h2>Gatherings</h2>
      <div id="gatherings"></div>
    </div>

    <!-- Profile -->
    <div class="card">
      <h2>Profile</h2>
      <p id="count">0 gatherings created</p>
      <button onclick="resetApp()">Reset</button>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
